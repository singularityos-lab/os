# DEVICE-FIX(gs201): the Shannon S5300 boots through the stock rfsd and cbd from the phone's own vendor partition
driver=shannon
modem_type=s5100sit
link_modules=pcie_gs201_cp allow_hw=1
modules=shm_ipc cpif
aspm=performance
ipc=/dev/umts_ipc0
esim_ipc=/dev/umts_ipc1
router=/dev/umts_router
audio_card=google,aoc-snd-card
