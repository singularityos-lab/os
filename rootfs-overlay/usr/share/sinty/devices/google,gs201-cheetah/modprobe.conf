# DEVICE-FIX(gs201): without the cap the Mali-G710 runs above the 572 MHz ceiling Omarchy Mobile validated on the Pixel 7 Pro
options clk_acpm gs201_gpu_max_khz=572000
# DEVICE-FIX(gs201): without allow_tx gs-decon cannot send DSI commands and does not take over the S6E3HC4 panel from the bootloader
options gs_dsim_cmd allow_tx=1
# DEVICE-FIX(gs201): without screen_off=2 gs-decon does not take over the panel the bootloader left lit and the phone stays on simpledrm
options gs_decon screen_off=2
# DEVICE-FIX(gs201): coldplug probes the Wi-Fi PCIe controller before its PHY and the BCM4389 never enumerates; the profile setup loads it in order
blacklist pcie_gs201
# DEVICE-FIX(gs201): gs201_aoc_boot binds the 181d0000.aoc node in place of aoc_core and the audio DSP never gets its firmware
blacklist gs201_aoc_boot
# DEVICE-FIX(gs201): the AoC hangs the phone when its modules autoload out of order; only the profile setup loads them, in the stock order
blacklist gsa
blacklist gs201_aoc_sysmmu
blacklist gs201_aoc_rails
blacklist mailbox_wc
blacklist aoc_core
blacklist aoc_channel_dev
# DEVICE-FIX(gs201): an amplifier driver loaded outside the speaker protection service plays unprotected and can damage the speakers
blacklist snd_soc_cs35l41_spi
# DEVICE-FIX(gs201): the MAX77759 TCPC and GPIO drivers fight the charger over the USB-C port; Omarchy Mobile keeps them off
blacklist tcpci_maxim
blacklist gpio_max77759
# DEVICE-FIX(gs201): the camera stack is not brought up yet and its regulators and sensors hang the boot when they probe
blacklist gpio_s2mpg13
blacklist slg51002_regulator
blacklist gs201_cam_power
blacklist gs201_cam_probe
blacklist imx386
blacklist phy_gs201_mipi_dcphy_rx
blacklist gs201_csis
blacklist s5kgn1
blacklist ak7375
blacklist sem1215
# DEVICE-FIX(gs201): without patchram_nowait the BCM4389 Bluetooth patch load blocks the probe until it times out
options btbcm patchram_nowait=1
# DEVICE-FIX(gs201): without speaker_protection the AoC sound card enforces no amplifier volume limits and the protection service refuses to unmute
options aoc_alsa_dev speaker_protection=1
