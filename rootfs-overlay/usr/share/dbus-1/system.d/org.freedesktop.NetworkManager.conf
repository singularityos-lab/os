<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Bus policy for sinty-nm. Mirrors NetworkManager's own policy: without an <allow
     own=...> rule the system bus refuses the name and the daemon cannot start. Install
     to /usr/share/dbus-1/system.d/org.freedesktop.NetworkManager.conf (replaces the one
     the NetworkManager package used to ship). -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
  <!-- Sinty is single-user with no polkit under sinit; the daemon's GetPermissions is
       deliberately permissive, so the bus policy matches: any local user may talk to us.
       The desktop session (non-root) needs AddAndActivateConnection to join networks. -->
  <policy context="default">
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
