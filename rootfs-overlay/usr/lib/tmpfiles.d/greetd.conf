# The greeter user's home lives under /var, which on an installed system is a FRESH
# empty partition created at firstboot -- so the /var/lib/greetd baked into the erofs is
# absent there. greetd chdir()s into the greeter home before exec, so a missing home ->
# ENOENT -> the greeter fails to start and the boot hangs at the loading screen. Recreate
# it on every boot (systemd-tmpfiles runs early), which costs nothing when it exists.
d /var/lib/greetd 0755 greeter greeter -
