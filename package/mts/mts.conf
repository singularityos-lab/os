# Sinty OS default Memory Tiering Standard configuration.
# Sinty is experimental: this enables ACTIVE (enforce) tiering so cold anonymous
# pages are demoted to a local cold tier, freeing DRAM for the working set. The
# cold tier is a sparse file on /var (provisioned by the mtsd service). Latency
# and bandwidth figures are conservative SSD-file estimates the PD1 ranker uses;
# they are refined against real hardware. Tune or set Mode=observe to only
# measure without moving pages.

[MTS]
Version=2
Mode=enforce

[Tier "cold"]
UUID=018f4a10-0000-7dd2-a400-5104720c0001
Kind=persistent-local-memory
Provider=/var/lib/mts/cold.img
# fd-scoped: the tier lives as long as the mtsd daemon holds it. When mtsd exits
# or is restarted (Restart=on-failure) the kernel auto-drains the tier, so a
# restart re-registers cleanly instead of hitting EEXIST on the fixed UUID.
Flags=fd-scoped
CapacityBytes=1073741824
ReadLatencyP50NSec=15000
ReadLatencyP99NSec=100000
WriteLatencyP50NSec=20000
WriteLatencyP99NSec=200000
ReadBandwidthBytesPerSec=500000000
WriteBandwidthBytesPerSec=400000000
MaxBatchPages=256
MaxInflightBatches=8

[Domain "/"]
Mode=enforce
Tiers=dram,cold
FaultServiceP99USec=500
ReuseHorizonUSec=1000000
ReserveCapacityBytes=536870912
ReserveReadBandwidthBytesPerSec=100000000
ReserveWriteBandwidthBytesPerSec=100000000
ReserveQueueSlots=4
