name: Sinty OS release
run-name: Sinty OS ${{ inputs.arch || 'x86_64' }}${{ inputs.anywhere && ' (moved)' || '' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [x86_64, aarch64, both]
        default: x86_64
      anywhere:
        description: Run on any build runner instead of the one that keeps this architecture's cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'build(self-hosted)')
    runs-on: ubuntu-24.04
    outputs:
      arches: ${{ steps.plan.outputs.arches }}
    steps:
      - name: Pick the architectures
        id: plan
        env:
          ARCH: ${{ inputs.arch || 'x86_64' }}
        run: |
          case "$ARCH" in
            both) echo 'arches=["x86_64","aarch64"]' ;;
            x86_64|aarch64) echo "arches=[\"$ARCH\"]" ;;
            *) echo "unknown architecture $ARCH"; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

  route:
    needs: plan
    if: ${{ !inputs.anywhere }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      actions: write
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    steps:
      - name: Move the build when its home runner does not take it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          ARCH: ${{ matrix.arch }}
          WANT: ${{ inputs.arch || 'x86_64' }}
          REF: ${{ github.ref_name }}
        run: |
          waited=0
          for i in $(seq 1 600); do
            state=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq ".jobs[] | select(.name == \"build $ARCH\") | .status + \" \" + (.runner_name // \"\")")
            case "$state" in
              ""|queued*|pending*|waiting*) ;;
              *) echo "build started: $state"; exit 0 ;;
            esac
            busy=0
            for r in $(gh api "repos/$REPO/actions/workflows/build-self-hosted.yml/runs?status=in_progress" --jq ".workflow_runs[] | select(.id != $RUN) | .id"); do
              n=$(gh api "repos/$REPO/actions/runs/$r/jobs" --jq "[.jobs[] | select(.status == \"in_progress\") | select(.name | startswith(\"build $ARCH\"))] | length")
              busy=$((busy + n))
            done
            if [ "$busy" = 0 ]; then waited=$((waited + 30)); else waited=0; fi
            if [ "$waited" -ge 300 ]; then
              echo "the home runner for $ARCH has not taken the build in 5 minutes, moving the release"
              gh workflow run build-self-hosted.yml -R "$REPO" --ref "$REF" -f arch="$WANT" -f anywhere=true
              gh run cancel "$RUN" -R "$REPO"
              exit 0
            fi
            sleep 30
          done

  build-x86_64:
    name: build x86_64
    needs: plan
    if: contains(needs.plan.outputs.arches, '"x86_64"')
    continue-on-error: true
    concurrency:
      group: build-self-hosted-x86_64
      cancel-in-progress: false
    runs-on: [self-hosted, sinty-build, "${{ inputs.anywhere && 'x86_64' || 'home-x86_64' }}"]
    timeout-minutes: 1440
    permissions:
      contents: write
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/build-image
        with:
          arch: x86_64
          stage: unsigned-${{ github.sha }}
      - name: Hand the stage to the signing step
        id: done
        run: echo "ok=1" >> "$GITHUB_OUTPUT"

  lost-x86_64:
    name: check the x86_64 runner
    needs: [plan, build-x86_64]
    if: always() && contains(needs.plan.outputs.arches, '"x86_64"') && needs.build-x86_64.outputs.ok != '1'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      lost: ${{ steps.check.outputs.lost }}
    steps:
      - name: Tell a lost runner from a failed build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          job=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq '[.jobs[] | select(.name == "build x86_64")] | last')
          concl=$(jq -r '.conclusion // ""' <<<"$job")
          failed=$(jq '[.steps[]? | select(.conclusion == "failure")] | length' <<<"$job")
          echo "build x86_64 ended as '$concl' with $failed failed steps"
          if [ "$concl" = failure ] && [ "$failed" = 0 ]; then
            echo "the runner went away, building on another one"
            echo "lost=1" >> "$GITHUB_OUTPUT"
          fi

  moved-x86_64:
    name: build x86_64 (moved)
    needs: [plan, build-x86_64, lost-x86_64]
    if: always() && needs.lost-x86_64.outputs.lost == '1'
    concurrency:
      group: build-self-hosted-x86_64
      cancel-in-progress: false
    runs-on: [self-hosted, sinty-build, x86_64]
    timeout-minutes: 1440
    permissions:
      contents: write
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/build-image
        with:
          arch: x86_64
          stage: unsigned-${{ github.sha }}-moved
      - name: Hand the stage to the signing step
        id: done
        run: echo "ok=1" >> "$GITHUB_OUTPUT"

  sign-x86_64:
    name: sign x86_64
    needs: [build-x86_64, moved-x86_64]
    if: always() && github.ref == 'refs/heads/main' && (needs.build-x86_64.outputs.ok == '1' || needs.moved-x86_64.outputs.ok == '1')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-sign.yml
    with:
      arch: x86_64
      sha: ${{ github.sha }}
      stage: ${{ needs.build-x86_64.outputs.ok == '1' && format('unsigned-{0}', github.sha) || format('unsigned-{0}-moved', github.sha) }}
    secrets: inherit

  publish-x86_64:
    name: publish x86_64
    needs: sign-x86_64
    if: always() && needs.sign-x86_64.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-feed.yml
    with:
      arch: x86_64
      sha: ${{ github.sha }}
      signed: ${{ needs.sign-x86_64.outputs.signed }}
    secrets: inherit

  released-x86_64:
    name: x86_64 released
    needs: [plan, build-x86_64, moved-x86_64, sign-x86_64, publish-x86_64]
    if: always() && contains(needs.plan.outputs.arches, '"x86_64"')
    runs-on: ubuntu-24.04
    steps:
      - name: Report the outcome of the x86_64 chain
        env:
          BUILT: ${{ needs.build-x86_64.outputs.ok == '1' || needs.moved-x86_64.outputs.ok == '1' }}
          SIGN: ${{ needs.sign-x86_64.result }}
          PUBLISH: ${{ needs.publish-x86_64.result }}
        run: |
          [ "$BUILT" = true ] || { echo "x86_64 did not build"; exit 1; }
          [ "$SIGN" = success ] || { echo "x86_64 built but the signing step ended as $SIGN"; exit 1; }
          [ "$PUBLISH" = success ] || { echo "x86_64 signed but publishing ended as $PUBLISH"; exit 1; }
          echo "x86_64 is on canary"

  build-aarch64:
    name: build aarch64
    needs: plan
    if: contains(needs.plan.outputs.arches, '"aarch64"')
    continue-on-error: true
    concurrency:
      group: build-self-hosted-aarch64
      cancel-in-progress: false
    runs-on: [self-hosted, sinty-build, "${{ inputs.anywhere && 'aarch64' || 'home-aarch64' }}"]
    timeout-minutes: 1440
    permissions:
      contents: write
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/build-image
        with:
          arch: aarch64
          stage: unsigned-aarch64-${{ github.sha }}
      - name: Hand the stage to the signing step
        id: done
        run: echo "ok=1" >> "$GITHUB_OUTPUT"

  lost-aarch64:
    name: check the aarch64 runner
    needs: [plan, build-aarch64]
    if: always() && contains(needs.plan.outputs.arches, '"aarch64"') && needs.build-aarch64.outputs.ok != '1'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      lost: ${{ steps.check.outputs.lost }}
    steps:
      - name: Tell a lost runner from a failed build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          job=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq '[.jobs[] | select(.name == "build aarch64")] | last')
          concl=$(jq -r '.conclusion // ""' <<<"$job")
          failed=$(jq '[.steps[]? | select(.conclusion == "failure")] | length' <<<"$job")
          echo "build aarch64 ended as '$concl' with $failed failed steps"
          if [ "$concl" = failure ] && [ "$failed" = 0 ]; then
            echo "the runner went away, building on another one"
            echo "lost=1" >> "$GITHUB_OUTPUT"
          fi

  moved-aarch64:
    name: build aarch64 (moved)
    needs: [plan, build-aarch64, lost-aarch64]
    if: always() && needs.lost-aarch64.outputs.lost == '1'
    concurrency:
      group: build-self-hosted-aarch64
      cancel-in-progress: false
    runs-on: [self-hosted, sinty-build, aarch64]
    timeout-minutes: 1440
    permissions:
      contents: write
    outputs:
      ok: ${{ steps.done.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/build-image
        with:
          arch: aarch64
          stage: unsigned-aarch64-${{ github.sha }}-moved
      - name: Hand the stage to the signing step
        id: done
        run: echo "ok=1" >> "$GITHUB_OUTPUT"

  sign-aarch64:
    name: sign aarch64
    needs: [build-aarch64, moved-aarch64]
    if: always() && github.ref == 'refs/heads/main' && (needs.build-aarch64.outputs.ok == '1' || needs.moved-aarch64.outputs.ok == '1')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-sign.yml
    with:
      arch: aarch64
      sha: ${{ github.sha }}
      stage: ${{ needs.build-aarch64.outputs.ok == '1' && format('unsigned-aarch64-{0}', github.sha) || format('unsigned-aarch64-{0}-moved', github.sha) }}
    secrets: inherit

  publish-aarch64:
    name: publish aarch64
    needs: sign-aarch64
    if: always() && needs.sign-aarch64.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-feed.yml
    with:
      arch: aarch64
      sha: ${{ github.sha }}
      signed: ${{ needs.sign-aarch64.outputs.signed }}
    secrets: inherit

  released-aarch64:
    name: aarch64 released
    needs: [plan, build-aarch64, moved-aarch64, sign-aarch64, publish-aarch64]
    if: always() && contains(needs.plan.outputs.arches, '"aarch64"')
    runs-on: ubuntu-24.04
    steps:
      - name: Report the outcome of the aarch64 chain
        env:
          BUILT: ${{ needs.build-aarch64.outputs.ok == '1' || needs.moved-aarch64.outputs.ok == '1' }}
          SIGN: ${{ needs.sign-aarch64.result }}
          PUBLISH: ${{ needs.publish-aarch64.result }}
        run: |
          [ "$BUILT" = true ] || { echo "aarch64 did not build"; exit 1; }
          [ "$SIGN" = success ] || { echo "aarch64 built but the signing step ended as $SIGN"; exit 1; }
          [ "$PUBLISH" = success ] || { echo "aarch64 signed but publishing ended as $PUBLISH"; exit 1; }
          echo "aarch64 is on canary"
