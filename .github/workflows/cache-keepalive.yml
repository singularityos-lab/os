name: Cache keepalive

on:
  schedule:
    - cron: '17 4 */4 * *'
  workflow_dispatch:

jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record the runner image
        run: echo "IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore Buildroot host toolchain
        uses: actions/cache/restore@v4
        with:
          path: buildroot-build/host
          key: buildroot-host-v4-${{ env.IMAGE_VERSION }}-keepalive
          restore-keys: |
            buildroot-host-v4-${{ env.IMAGE_VERSION }}-

      - name: Restore Buildroot package build tree
        uses: actions/cache/restore@v4
        with:
          path: buildroot-build/build
          key: buildroot-build-v10-${{ env.IMAGE_VERSION }}-keepalive
          restore-keys: |
            buildroot-build-v10-${{ env.IMAGE_VERSION }}-
