name: Singularity Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to publish into (nightly, beta, ...); empty builds only'
        required: false
        default: ''
      review:
        description: 'Review id for the table row, e.g. r17'
        required: false
        default: ''

concurrency:
  group: build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.parse.outputs.run }}
      tag: ${{ steps.parse.outputs.tag }}
      review: ${{ steps.parse.outputs.review }}
      build: ${{ steps.number.outputs.build }}
    steps:
      - name: Read the release request
        id: parse
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REVIEW: ${{ inputs.review }}
        run: |
          tag="$INPUT_TAG"
          review="$INPUT_REVIEW"
          run=false
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && run=true
          first=$(printf '%s\n' "$MESSAGE" | head -n 1)
          if [[ "$first" =~ ^build\(tag:([A-Za-z0-9._-]+)\):\ (r[0-9]+)$ ]]; then
            tag=${BASH_REMATCH[1]}
            review=${BASH_REMATCH[2]}
            run=true
          elif [[ "$first" =~ ^build:\ (r[0-9]+)$ ]]; then
            tag=nightly
            review=${BASH_REMATCH[1]}
            run=true
          elif [[ "$first" =~ ^build\(test\)(:.*)?$ ]]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] && ! [[ "$review" =~ ^r[0-9]+$ ]]; then
            echo "::error::a release needs a review id like r17, got '$review'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "review=$review" >> "$GITHUB_OUTPUT"
          if [ "$run" != true ]; then
            echo "No build requested: use 'build: r45', 'build(tag:beta): r45' or 'build(test)' as the commit subject"
          elif [ -n "$tag" ]; then
            echo "Publishing $review into the $tag release"
          else
            echo "Build only"
          fi

      - name: Number the build
        id: number
        if: steps.parse.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          committed=$(gh api "repos/$GITHUB_REPOSITORY/contents/release/product-build?ref=$GITHUB_SHA" -q .content | base64 -d | tr -d '[:space:]')
          prefix=$(printf '%s' "$committed" | sed -E 's/[0-9]+$//')
          last=$( { echo "$committed"; gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null; } \
            | grep -oE "${prefix}[0-9]+" | sed "s/^$prefix//" | sort -n | tail -n 1)
          build=$(printf '%s%03d' "$prefix" $((10#$last + 1)))
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build number $build"

  stage1:
    needs: meta
    if: needs.meta.outputs.run == 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
      build: ${{ needs.meta.outputs.build }}
    secrets: inherit

  stage2:
    needs: [meta, stage1]
    if: needs.stage1.outputs.incomplete == '1'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
      build: ${{ needs.meta.outputs.build }}
    secrets: inherit

  stage3:
    needs: [meta, stage2]
    if: needs.stage2.outputs.incomplete == '1'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
      build: ${{ needs.meta.outputs.build }}
    secrets: inherit

  stage4:
    needs: [meta, stage3]
    if: needs.stage3.outputs.incomplete == '1'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
      build: ${{ needs.meta.outputs.build }}
    secrets: inherit

  test:
    runs-on: ubuntu-24.04
    needs: [stage1, stage2, stage3, stage4]
    if: >-
      always() && !cancelled() && (
      (needs.stage1.result == 'success' && needs.stage1.outputs.incomplete != '1') ||
      (needs.stage2.result == 'success' && needs.stage2.outputs.incomplete != '1') ||
      (needs.stage3.result == 'success' && needs.stage3.outputs.incomplete != '1') ||
      (needs.stage4.result == 'success' && needs.stage4.outputs.incomplete != '1'))
    timeout-minutes: 30

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: singularity-${{ github.sha }}
          path: images/

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm 2>/dev/null || true

      - name: Boot the image to the default target
        run: |
          accel=tcg
          [ -w /dev/kvm ] && accel=kvm
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          cp images/artifacts/sinty-os.img disk.img
          part=$(sfdisk -J disk.img | jq -r '.partitiontable as $t | .partitiontable.partitions[] | select(.name == "sintylogs") | "\(.start) \(.size) \($t.sectorsize // 512)"')
          read -r start size sector <<< "$part"
          timeout 600 qemu-system-x86_64 -machine q35,accel=$accel -m 4096 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.img,if=none,id=usb0,format=raw \
            -device qemu-xhci -device usb-storage,drive=usb0,bootindex=0 \
            -display none -serial file:serial.log -no-reboot &
          qemu=$!
          logs() {
            dd if=disk.img of=logs.ext4 bs=$sector skip=$start count=$size status=none
            for f in $(debugfs -R "ls -p /" logs.ext4 2>/dev/null | awk -F/ '$6 ~ /^boot-.*\.log$/ {print $6}'); do
              debugfs -R "cat /$f" logs.ext4 2>/dev/null
            done > boot.log
          }
          for _ in $(seq 60); do
            sleep 10
            grep -qE "signature INVALID|Kernel panic" serial.log 2>/dev/null && break
            kill -0 $qemu 2>/dev/null || break
            logs
            grep -q "atom\[1\]: reached " boot.log && break
          done
          kill $qemu 2>/dev/null || true
          wait $qemu 2>/dev/null || true
          logs
          tr -d '\r' < serial.log | tail -n 20
          grep -E "atom\[1\]: " boot.log | tail -n 40
          grep -q "atom\[1\]: reached " boot.log
          ! grep -q "atom\[1\]: ERROR starting" boot.log

  publish:
    runs-on: ubuntu-24.04
    needs: [meta, test]
    if: >-
      always() && needs.test.result == 'success' &&
      needs.meta.outputs.tag != ''
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.meta.outputs.tag }}
      cancel-in-progress: false
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: singularity-${{ github.sha }}
          path: images/

      - name: Publish into the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          REVIEW: ${{ needs.meta.outputs.review }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          [ -z "$BUILD" ] || echo "$BUILD" > release/product-build
          ./scripts/publish-release.sh "$TAG" "$REVIEW" "$GITHUB_SHA" images/artifacts
