name: Singularity Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  stage1:
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
    secrets: inherit

  stage2:
    needs: stage1
    if: needs.stage1.outputs.incomplete == '1'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
    secrets: inherit

  stage3:
    needs: stage2
    if: needs.stage2.outputs.incomplete == '1'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
    secrets: inherit

  stage4:
    needs: stage3
    if: needs.stage3.outputs.incomplete == '1'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
    secrets: inherit

  test:
    runs-on: ubuntu-24.04
    needs: [stage1, stage2, stage3, stage4]
    if: >-
      always() && !cancelled() && (
      (needs.stage1.result == 'success' && needs.stage1.outputs.incomplete != '1') ||
      (needs.stage2.result == 'success' && needs.stage2.outputs.incomplete != '1') ||
      (needs.stage3.result == 'success' && needs.stage3.outputs.incomplete != '1') ||
      (needs.stage4.result == 'success' && needs.stage4.outputs.incomplete != '1'))
    timeout-minutes: 10

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: singularity-${{ github.sha }}
          path: images/

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86

      - name: Test boot with QEMU
        run: |
          KERNEL="images/bzImage"

          if [ ! -f "$KERNEL" ]; then
            echo "Kernel not found, skipping"
            exit 0
          fi

          timeout 30 qemu-system-x86_64 \
            -kernel "$KERNEL" \
            -append "console=ttyS0 quiet" \
            -nographic \
            -m 256M \
            -no-reboot 2>&1 | head -80 || true

          echo "QEMU boot test done"

  release:
    runs-on: ubuntu-24.04
    needs: test
    if: always() && needs.test.result == 'success' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: singularity-${{ github.sha }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Sinty OS ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*
