name: sdk

# Builds the Singularity OS SDK image (Dockerfile.sdk) and publishes it to GHCR.
# Component repositories pull ghcr.io/singularityos-lab/sinty-os-sdk to
# cross-build their release binaries against the OS toolchain and sysroot.
#
# The buildroot `sdk` target builds `world` (the full OS), so this job is heavy:
# it needs most of the runner disk and can run for a long time. The free-disk
# step reclaims space the ubuntu image wastes on unused SDKs; a larger runner is
# the alternative if this ever runs short.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'buildroot-config/**'
      - 'Config.in'
      - 'external.*'
      - 'package/**'
      - 'Dockerfile.sdk'
      - '.github/workflows/sdk.yml'

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the SDK image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sdk
          push: true
          tags: ghcr.io/singularityos-lab/sinty-os-sdk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
