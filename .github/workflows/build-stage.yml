name: Singularity Build stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
    outputs:
      incomplete:
        value: ${{ jobs.build.outputs.incomplete }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      incomplete: ${{ steps.compile.outputs.incomplete }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Atom Loops
        uses: actions/checkout@v4
        with:
          repository: mirkobrombin/AtomLoops
          ref: 15c87ab8a2598fbfff90606b1881035dce01c9e3
          path: _deps/AtomLoops

      - name: Checkout recovery
        uses: actions/checkout@v4
        with:
          repository: singularityos-lab/sinty-recovery
          ref: 6e44fd52e47828ba19431f7e00e17fc2dade2a11
          path: _deps/sinty-recovery

      - name: Checkout initramfs
        uses: actions/checkout@v4
        with:
          repository: singularityos-lab/sinty-initramfs
          ref: 0869ef28501110b82cef02774913d467397c825c
          path: _deps/sinty-initramfs

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Free disk space and host the build on /mnt
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo mkdir -p /mnt/br/build /mnt/br/dl
          mkdir -p buildroot-build buildroot-dl
          sudo mount --bind /mnt/br/build buildroot-build
          sudo mount --bind /mnt/br/dl buildroot-dl
          sudo chown -R "$(id -u):$(id -g)" /mnt/br buildroot-build buildroot-dl
          df -h / /mnt

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential gcc g++ make \
            bc bison flex \
            libssl-dev libelf-dev \
            libncurses-dev \
            wget rsync cpio \
            xz-utils gzip bzip2 zstd \
            patch perl python3 \
            git unzip curl \
            erofs-utils \
            cryptsetup-bin \
            systemd-boot \
            binutils sassc mtools dosfstools \
            bubblewrap xdg-dbus-proxy

      # $ImageVersion is a runner environment variable, not a workflow one, so
      # ${{ env.ImageVersion }} expands to nothing in a cache key -- the keys read
      # "-v10--<hash>" until this was noticed. Copy it into the workflow env so the
      # keys really do change when GitHub bumps the image.
      - name: Record the runner image
        run: echo "IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore Buildroot source tree
        uses: actions/cache/restore@v4
        with:
          path: buildroot-src
          key: buildroot-src-2026.02.2-${{ hashFiles('buildroot-source-patches/**', 'scripts/prepare.sh') }}

      - name: Restore Buildroot host toolchain
        uses: actions/cache/restore@v4
        with:
          path: buildroot-build/host
          key: buildroot-host-v4-${{ env.IMAGE_VERSION }}-${{ hashFiles('buildroot-config/singularity_defconfig', 'buildroot-config/kernel.config', 'buildroot-source-patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          restore-keys: |
            buildroot-host-v4-${{ env.IMAGE_VERSION }}-${{ hashFiles('buildroot-config/singularity_defconfig', 'buildroot-config/kernel.config', 'buildroot-source-patches/**') }}-
            buildroot-host-v4-${{ env.IMAGE_VERSION }}-

      - name: Restore Buildroot package build tree
        uses: actions/cache/restore@v4
        with:
          path: buildroot-build/build
          key: buildroot-build-v10-${{ env.IMAGE_VERSION }}-${{ hashFiles('buildroot-config/singularity_defconfig', 'buildroot-config/kernel.config', 'buildroot-source-patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}
          restore-keys: |
            buildroot-build-v10-${{ env.IMAGE_VERSION }}-${{ hashFiles('buildroot-config/singularity_defconfig', 'buildroot-config/kernel.config', 'buildroot-source-patches/**') }}-
            buildroot-build-v10-${{ env.IMAGE_VERSION }}-

      - name: Prepare Buildroot
        run: ./scripts/prepare.sh

      - name: Reset target dir and re-stage from the cached build tree
        run: |
          rm -rf buildroot-build/target
          mkdir -p buildroot-build/target
          find buildroot-build/build -name ".stamp_target_installed" -delete 2>/dev/null || true
          find buildroot-build/build -name ".stamp_staging_installed" -delete 2>/dev/null || true
          find buildroot-build/build -name ".stamp_images_installed" -delete 2>/dev/null || true

      - name: Rebuild host LLVM stack if cached without RTTI
        run: |
          if find buildroot-build/build -name CMakeCache.txt -path '*host-llvm*' \
               -exec grep -l 'LLVM_ENABLE_RTTI:BOOL=OFF' {} + 2>/dev/null | grep -q .; then
            echo "::warning::Cached host-llvm predates the LLVM_RTTI requirement; rebuilding the host LLVM stack."
            rm -rf buildroot-build/build/host-llvm-* \
                   buildroot-build/build/host-clang-* \
                   buildroot-build/build/host-mesa3d-* \
                   buildroot-build/build/host-spirv-* 2>/dev/null || true
          else
            echo "host-llvm RTTI state OK (RTTI=ON or not yet built)."
          fi

      - name: Rebuild the packages built from this repo's own sources
        run: |
          # Buildroot stamps record that a package was built, not what it was built
          # from, so a restored cache keeps shipping the previous build of anything
          # whose source lives in this tree -- a fix committed here never reaches the
          # image. Drop those build dirs so they rebuild against the current source.
          # linux-pam is included because it links the shim and has to relink.
          for p in $(grep -l 'SITE_METHOD = local' package/*/*.mk | xargs -n1 dirname | xargs -n1 basename) linux-pam; do
            rm -rf buildroot-build/build/${p}-* 2>/dev/null || true
          done
          # The staging sysroot is cached separately and a dropped build dir does not
          # touch it, so the link line kept resolving against the previously installed
          # shim: the build failed on a symbol that the current source does export.
          # Remove what the shim installs there too, so it is reinstalled from this build.
          rm -f buildroot-build/host/*/sysroot/usr/lib/libsystemd.so* \
                buildroot-build/host/*/sysroot/usr/lib/pkgconfig/libsystemd.pc 2>/dev/null || true
          rm -rf buildroot-build/host/*/sysroot/usr/include/systemd 2>/dev/null || true

      - name: Rebuild the packages changed by the Buildroot source patches
        run: |
          rec=buildroot-build/build/.source-patch-hashes
          mkdir -p buildroot-build/build
          touch "$rec"
          for p in $(sed -n 's|^diff --git a/package/\([^/]*\)/.*|\1|p' buildroot-source-patches/*.patch | sort -u); do
            h=$(grep -l "^diff --git a/package/$p/" buildroot-source-patches/*.patch | xargs cat | sha256sum | cut -c1-16)
            if ! grep -qx "$p $h" "$rec"; then
              echo "patch for $p changed: rebuilding it"
              rm -rf buildroot-build/build/"$p"-*
              sed -i "/^$p /d" "$rec"
              echo "$p $h" >> "$rec"
            fi
          done

      - name: Install Zig 0.16.0
        run: |
          curl --fail --location --silent --show-error https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz --output /tmp/zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz' | sha256sum -c -
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo /tmp/zig-x86_64-linux-0.16.0 >> "$GITHUB_PATH"

      - name: Compile
        id: compile
        env:
          ATOM_BUILD: rc
        run: |
          set +e
          timeout 320m ./scripts/compile.sh 2>&1 | tee build.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" = "124" ]; then
            echo "BUILD_INCOMPLETE=1" >> "$GITHUB_ENV"
            echo "incomplete=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Compile hit the 320m budget; cache is saved and the build resumes on the next run."
            exit 0
          fi
          exit "$ec"

      - name: Save Buildroot source tree
        if: always()
        uses: actions/cache/save@v4
        with:
          path: buildroot-src
          key: buildroot-src-2026.02.2-${{ hashFiles('buildroot-source-patches/**', 'scripts/prepare.sh') }}

      - name: Save Buildroot host toolchain
        if: always()
        uses: actions/cache/save@v4
        with:
          path: buildroot-build/host
          key: buildroot-host-v4-${{ env.IMAGE_VERSION }}-${{ hashFiles('buildroot-config/singularity_defconfig', 'buildroot-config/kernel.config', 'buildroot-source-patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}

      - name: Save Buildroot package build tree
        if: always()
        uses: actions/cache/save@v4
        with:
          path: buildroot-build/build
          key: buildroot-build-v10-${{ env.IMAGE_VERSION }}-${{ hashFiles('buildroot-config/singularity_defconfig', 'buildroot-config/kernel.config', 'buildroot-source-patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.stage }}

      - name: Package
        if: env.BUILD_INCOMPLETE != '1'
        env:
          ATOMLOOPS: ${{ github.workspace }}/_deps/AtomLoops
          SINTY_RECOVERY: ${{ github.workspace }}/_deps/sinty-recovery
          SINTY_INITRAMFS: ${{ github.workspace }}/_deps/sinty-initramfs
          ATOM_ROOT_PUB_B64: ${{ secrets.ATOM_ROOT_PUB }}
          ATOM_SIGNING_KEY_B64: ${{ secrets.ATOM_SIGNING_KEY }}
          ATOM_SIGNING_CERT_B64: ${{ secrets.ATOM_SIGNING_CERT }}
          ATOM_SIGNING_CERT_SIG_B64: ${{ secrets.ATOM_SIGNING_CERT_SIG }}
          EXPECTED_ROOT_FP: bee0f3b78c53389b
        run: |
          set -o pipefail
          # When the base64-encoded signing secrets are present, decode them and hand
          # package.sh the production chain; otherwise it generates a dev chain.
          if [ -n "$ATOM_SIGNING_KEY_B64" ]; then
            d="$RUNNER_TEMP/atom-signing"; mkdir -p "$d"
            printf '%s' "$ATOM_ROOT_PUB_B64"         | base64 -d > "$d/root.pub"
            printf '%s' "$ATOM_SIGNING_KEY_B64"      | base64 -d > "$d/signing-v1.key"
            printf '%s' "$ATOM_SIGNING_CERT_B64"     | base64 -d > "$d/signing-cert-v1.json"
            printf '%s' "$ATOM_SIGNING_CERT_SIG_B64" | base64 -d > "$d/signing-cert-v1.json.sig"
            export ATOM_ROOT_PUB="$d/root.pub" ATOM_SIGNING_KEY="$d/signing-v1.key"
            export ATOM_SIGNING_CERT="$d/signing-cert-v1.json" ATOM_SIGNING_CERT_SIG="$d/signing-cert-v1.json.sig"
            echo "[package] using the production signing chain from secrets"
          fi
          export ATOM_BUILD=rc
          ATOM_VERSION="$(git rev-list --count HEAD)"
          export ATOM_VERSION
          ./scripts/package.sh 2>&1 | tee package.log
          if [ -n "$ATOM_SIGNING_KEY_B64" ]; then
            fp=$(sed -n 's/^\[package\] loader trust root verified: //p' package.log)
            if [ "$fp" != "$EXPECTED_ROOT_FP" ]; then
              echo "::error::signed with root $fp, expected $EXPECTED_ROOT_FP"
              exit 1
            fi
          fi

      - name: Show final artifacts
        if: env.BUILD_INCOMPLETE != '1'
        run: |
          echo "=== Atom Loops artifacts ==="
          ls -lh artifacts/
          echo "root_hash: $ROOT_HASH"

      - name: Upload artifacts
        if: env.BUILD_INCOMPLETE != '1'
        uses: actions/upload-artifact@v4
        with:
          name: singularity-${{ github.sha }}
          path: |
            artifacts/sinty-os.iso
            artifacts/sinty-os.img
            artifacts/sinty-os-portable.img
            artifacts/kernelcache.efi
            artifacts/kernelcache.efi.sig
            artifacts/kernelcache-recovery.efi
            artifacts/kernelcache-recovery.efi.sig
            artifacts/rootfs.erofs
            artifacts/rootfs.hash
            artifacts/verity-output.txt
            buildroot-build/images/bzImage
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}-${{ inputs.stage }}
          path: build.log
          retention-days: 3
