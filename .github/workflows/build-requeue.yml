name: Requeue a lost build

on:
  workflow_run:
    workflows: ["Singularity Build (self-hosted)"]
    types: [completed]

permissions:
  actions: write

jobs:
  requeue:
    if: github.event.workflow_run.conclusion == 'failure' && !contains(github.event.workflow_run.display_title, '(moved)')
    runs-on: ubuntu-24.04
    steps:
      - name: Move the build when its runner went away
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          lost=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq '[.jobs[] | select(.conclusion == "failure") | select(all(.steps[]?; .conclusion != "failure"))] | length')
          if [ "$lost" = 0 ]; then
            echo "the build failed on its own, nothing to requeue"
            exit 0
          fi
          arch=$(echo "$TITLE" | awk '{print $3}')
          case "$arch" in x86_64|aarch64) ;; *) echo "unknown architecture in '$TITLE'"; exit 1 ;; esac
          echo "a runner went away during run $RUN, moving the $arch build to the other runner"
          gh workflow run build-self-hosted.yml -R "$REPO" --ref "$BRANCH" -f arch="$arch" -f anywhere=true
